<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Marketing Ninja Academy</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#f5f5f7;font-family:system-ui,Arial}header{padding:18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #30313a}.logo{background:#ed303e;padding:12px;border-radius:12px;font-weight:900}small,.muted{color:#aeb1bc}nav{display:flex;overflow:auto;gap:7px;padding:12px;border-bottom:1px solid #30313a}button{cursor:pointer;border:0;border-radius:9px;padding:11px 14px;background:#e52b38;color:white;font-weight:700}nav button{background:#222630;white-space:nowrap}nav button.active{background:#e52b38}main{padding:22px;max-width:1050px;margin:auto}.hero{background:radial-gradient(at 80% 10%,#59202a,transparent 65%),#171a22;border-radius:18px;padding:35px 23px}h1{font-size:clamp(32px,6vw,54px);line-height:1.13}h2{font-size:25px}.red{color:#ff5260}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#191c24;border:1px solid #343742;border-radius:13px;padding:19px;margin:12px 0}.card p{color:#bec0cb;line-height:1.6}.tag{font-size:11px;color:#ff7780;letter-spacing:2px;font-weight:800}.belt{height:14px;border-radius:4px;margin:9px 0}.bar{height:9px;background:#383b45;border-radius:20px;overflow:hidden}.fill{height:100%;background:#e52b38}input,select{background:#232630;color:white;border:1px solid #555965;padding:12px;border-radius:8px;width:100%;margin:7px 0 14px}label{display:block;margin-top:10px}.option{display:block;width:100%;text-align:left;margin:8px 0;background:#282c36}.option.chosen{outline:2px solid #ff5663}.quiet{background:#292c35}section{margin-bottom:30px}a{color:#ff747e}#feedback{line-height:1.7}</style><header><div class="logo">忍</div><div><b>DIGITAL MARKETING <span class="red">NINJA</span></b><div class="tag">ACADEMY • MVP DEMO</div></div></header><nav id="nav"></nav><main id="app"></main><script>
const courses=[['Digital Marketing Foundations','Branding, audience research, content and analytics','Beginner'],['AI for Business and Marketing','ChatGPT, prompts and responsible AI workflows','Beginner'],['Website & Conversion Mastery','Landing pages, UX, lead capture and tracking','Intermediate'],['SEO Ninja','Keywords, local SEO, technical basics and reporting','Intermediate'],['Paid Advertising','Google Ads, Meta Ads and optimization','Intermediate'],['CRM & Marketing Automation','Pipelines, email, SMS and AI assistants','Intermediate'],['Agency & Entrepreneurship','Client acquisition, pricing and retention','Advanced'],['Personal Branding & Social Media','Short-form video, storytelling and growth','Beginner']];const belts=[['White','#eee','Foundations'],['Yellow','#efc942','Content & Social'],['Orange','#ed8a37','Websites & SEO'],['Green','#3fa477','Advertising'],['Blue','#4d8aee','AI & Automation'],['Brown','#94654a','Strategy'],['Black','#444','Mastery']];const qs=[['What is a conversion?',['Any page view','A desired action taken by a visitor','A social impression'],1],['Which CTA is clearest?',['Welcome','Read everything','Book Your Free Consultation'],2],['10 leads from 200 visitors is what conversion rate?',['2%','5%','10%'],1],['What should you define before a campaign?',['Target audience and measurable goal','Logo animation','Hashtags'],0]];let page='Home',done=false,answers={},submitted=false,checks=[false,false,false],coach='';const app=document.querySelector('#app'),nav=document.querySelector('#nav');function go(p){page=p;render();window.scrollTo(0,0)}function card(t,d){return `<div class="card"><h3>${t}</h3><p>${d}</p></div>`}function render(){nav.innerHTML=['Home','Courses','Dashboard','Belts','Lesson','AI Coach','Onboarding'].map(p=>`<button class="${p===page?'active':''}" onclick="go('${p}')">${p}</button>`).join('');let s='';if(page==='Home')s=`<div class="hero"><div class="tag">TRAIN • EXECUTE • MASTER</div><h1>Master Digital Marketing.<br><span class="red">Harness AI.</span><br>Build Your Future.</h1><p class="muted">Practical, hands-on digital marketing education for business owners, entrepreneurs and aspiring marketers. Progress through real projects and mastery challenges.</p><button onclick="go('Onboarding')">Start Your Training →</button> <button class="quiet" onclick="go('Courses')">Explore the Academy</button><p class="tag">1% BETTER EVERY DAY.</p></div><section><h2>Featured training</h2><div class="grid">${courses.slice(0,4).map(c=>card(c[0],c[1])).join('')}</div></section><section><h2>How it works</h2><div class="grid">${card('01 • Assess','Find the best learning path for your goals.')}${card('02 • Train','Study practical lessons and examples.')}${card('03 • Execute','Complete challenges and real-world projects.')}${card('04 • Master','Pass quizzes and work toward academy belts.')}</div></section>${card('Meet the Founder • David Perron','Entrepreneur and founder of Everyday Marketing Services. This academy combines practical digital marketing and AI education with the discipline of martial arts.') }<h2>Sample plans (placeholder pricing)</h2><div class="grid">${card('Free Starter • $0','Introductory resources')}${card('Individual Course • $99','Illustrative one-time purchase')}${card('Membership • $29/mo','Illustrative recurring access')}</div><h2>Frequently asked questions</h2>${card('Do I need experience?','No. Start at White Belt.')}${card('Are belts accredited?','No. Belts are internal academy achievements, not external certifications.')}<div class="card"><h3>Launch updates</h3><input type="email" placeholder="Email address" id="email"><button onclick="alert('Demo only: no email has been sent or stored.')">Join waitlist (demo)</button></div>`;if(page==='Courses')s=`<h2>Course Catalogue</h2><p class="muted">Only the foundation lesson is fully interactive. Other courses are curriculum previews.</p><input id="search" placeholder="Search courses" oninput="filterCourses()"><select id="level" onchange="filterCourses()"><option>All</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select><div class="grid" id="results"></div>`;if(page==='Dashboard')s=`<h2>Student Dashboard</h2><p class="muted">Demonstration profile. Progress stays in this browser only.</p>${card('🥋 White Belt Ninja',`Current progress: ${done?'Sample lesson completed':'Start your first lesson'}<div class="bar"><div class="fill" style="width:${done?25:0}%"></div></div>`)}<div class="grid">${card('Completed lessons',done?'1':'0')}${card('Latest quiz',submitted?`${qs.filter((q,i)=>answers[i]===q[2]).length*25}%`:'Not attempted')}${card('Next belt','Yellow')}${card('Weekly goal','3 lessons')}</div>${card('Recommended next lesson','Build a Landing Page That Converts <p><button onclick="go(\'Lesson\')">Open Lesson</button></p>')}<h2>Achievement pathway</h2>${belts.map((b,i)=>card(`${b[0]} Belt`,`${b[2]} • ${i===0?'Training available':'Planned'}`)).join('')}`;if(page==='Belts')s=`<h2>Ninja Belt Progression</h2><p class="muted">Academy-only achievement levels. Not accredited certifications.</p><div class="grid">${belts.map((b,i)=>`<div class="card"><div class="belt" style="background:${b[1]}"></div><h3>${b[0]} Belt</h3><p>${b[2]}</p><small>${i===0?'Sample training available':'Planned curriculum'}</small><p>Mastery criteria: complete lessons, score at least 80%, and submit a practical project for review.</p></div>`).join('')}</div>`;if(page==='Lesson')s=`<div class="tag">WHITE BELT • SAMPLE LESSON 01</div><h2>Build a Landing Page That Converts</h2><div class="card" style="text-align:center;padding:60px 10px"><div style="font-size:42px">▶</div><b>Video lesson placeholder</b><p>Video hosting is not connected</p></div>${card('1. Choose one audience and goal','Example: A local roofing company wants homeowners with leaking roofs to request a free estimate. Speak to that need directly.')}${card('2. Use a clear page structure','Headline → benefit → trust signals → service details → call to action → short lead form → FAQ.')}${card('3. Measure results','Conversion rate = conversions ÷ visitors × 100. Twelve leads from 240 visitors is a 5% conversion rate.')}<div class="card"><h3>Copyable AI Prompt</h3><p id="prompt">Act as a conversion copywriter. Create a landing page outline for a [business] targeting [audience]. Include a strong headline, benefits, trust-building sections, one clear CTA, lead form recommendations and three FAQs. Avoid unsupported claims.</p><button onclick="copyPrompt()">Copy Prompt</button></div><div class="card"><h3>Practical project checklist</h3>${['Identify target audience','Write headline and CTA','Define lead form and conversion goal'].map((x,i)=>`<label><input style="width:auto" type="checkbox" ${checks[i]?'checked':''} onchange="checks[${i}]=this.checked"> ${x}</label>`).join('')}</div><h2>Knowledge Check</h2><p class="muted">Pass: all 4 questions correct (80% threshold).</p>${qs.map((q,i)=>`<div class="card"><h3>${i+1}. ${q[0]}</h3>${q[1].map((a,j)=>`<button class="option ${answers[i]===j?'chosen':''}" ${submitted?'disabled':''} onclick="answers[${i}]=${j};render()">${a}</button>`).join('')}${submitted?`<p>${answers[i]===q[2]?'✓ Correct':'✗ Correct answer: '+q[1][q[2]]}</p>`:''}</div>`).join('')}<div class="card">${submitted?`<h3>Score: ${qs.filter((q,i)=>answers[i]===q[2]).length*25}%</h3><button onclick="submitted=false;answers={};render()">Retake Quiz</button>`:`<button onclick="submitQuiz()">Submit Quiz</button>`}<p><button onclick="completeLesson()">${done?'Completed ✓':'Complete Sample Lesson'}</button></p></div>`;if(page==='AI Coach')s=`<h2>AI Ninja Coach</h2><p class="muted">Scripted demonstration only. No live AI connected.</p><div class="card"><h3>What would you like help with?</h3>${['Explain conversion rates','Quiz me on marketing','Improve my landing page','Recommend a learning path'].map((x,i)=>`<button class="option" onclick="coachAnswer(${i})">${x}</button>`).join('')}<p id="feedback">${coach}</p></div>${card('Production integration','Requires a secure server-side AI API, access controls, content retrieval and privacy safeguards.')}`;if(page==='Onboarding')s=`<h2>Personalized Ninja Onboarding</h2><p class="muted">Answer these questions to get a suggested learning path.</p><div class="card">${[['experience','Your experience',['New to marketing','Some experience','Experienced']],['goal','Your goal',['Grow my business','Start an agency','Marketing career']],['ai','AI familiarity',['New to AI','Occasional user','Experienced']],['topic','Preferred topic',['Foundations','AI and automation','SEO and websites','Social media','Advertising']],['time','Weekly study time',['1–2 hours','3–5 hours','6+ hours']],['style','Learning preference',['Video','Reading','Hands-on projects']]].map(x=>`<label>${x[1]}<select id="${x[0]}">${x[2].map(v=>`<option>${v}</option>`).join('')}</select></label>`).join('')}<button onclick="recommend()">Generate My Path</button><div id="recommendation"></div></div>`;app.innerHTML=s;if(page==='Courses')filterCourses()}function filterCourses(){let q=document.querySelector('#search').value.toLowerCase(),l=document.querySelector('#level').value;document.querySelector('#results').innerHTML=courses.filter(c=>(l==='All'||c[2]===l)&&c.join(' ').toLowerCase().includes(q)).map((c,i)=>card(c[0],`${c[1]}<br><small>${c[2]} • ${c[0]==='Digital Marketing Foundations'?'Interactive sample':'Curriculum preview'}</small><p><button onclick="go('Lesson')">${c[0]==='Digital Marketing Foundations'?'Open Sample Lesson':'Try Sample Lesson'}</button></p>`)).join('')||'<p>No courses found.</p>'}function submitQuiz(){if(Object.keys(answers).length!==4)return alert('Answer all four questions.');submitted=true;render()}function completeLesson(){if(!submitted||!qs.every((q,i)=>answers[i]===q[2])||!checks.every(Boolean))return alert('Complete the project checklist and pass all four quiz questions.');done=true;go('Dashboard')}function copyPrompt(){let t=document.querySelector('#prompt').innerText;navigator.clipboard?.writeText(t).then(()=>alert('Prompt copied!')).catch(()=>alert('Copy not supported in this browser.'))}function coachAnswer(i){coach=['Conversion rate is the percentage of visitors who complete a valuable action, such as requesting a quote.','Practice: What is the difference between a website visit and a qualified lead?','Make your audience, offer and call to action specific. Add credible trust signals.','Begin with Digital Marketing Foundations, then explore a specialty based on your goals.'][i];render()}function recommend(){let exp=document.querySelector('#experience').value,topic=document.querySelector('#topic').value,time=document.querySelector('#time').value;let track=exp==='New to marketing'?'Digital Marketing Foundations':({'AI and automation':'AI for Business and Marketing','SEO and websites':'Website & Conversion Mastery','Social media':'Personal Branding & Social Media','Advertising':'Paid Advertising'})[topic]||'Digital Marketing Foundations';document.querySelector('#recommendation').innerHTML=`<div class="card"><h3>Recommended: ${track}</h3><p>Study ${time} weekly. Complete the foundations lesson and a practical project first.</p><button onclick="go('Lesson')">Start Sample Lesson</button></div>`}render();</script></html>
